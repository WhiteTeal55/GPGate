name: build

on:
  workflow_dispatch:
  push:
    tags: ["*"]

permissions:
  contents: write # 创建 Release 需要

jobs:
  build:
    runs-on: windows-latest
    strategy:
      matrix:
        include:
          # 需 .NET 10 桌面运行时
          - artifact: GPGate-win-x64
            file: GPGate.exe
            args: --self-contained false
          # 免运行时
          - artifact: GPGate-win-x64-standalone
            file: GPGate-standalone.exe
            args: --self-contained true -p:EnableCompressionInSingleFile=true
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x

      - name: 校验版本号
        if: startsWith(github.ref, 'refs/tags/')
        shell: pwsh
        run: |
          $tag = $env:GITHUB_REF_NAME
          if (-not $tag.StartsWith('v')) {
            throw "tag 必须以 v 开头：$tag"
          }
          $version = dotnet msbuild src/GPGate/GPGate.csproj -getProperty:Version
          if ($version -ne $tag.Substring(1)) {
            throw "tag $tag 与 csproj Version $version 不一致"
          }

      - name: 发布
        run: dotnet publish src/GPGate/GPGate.csproj -c Release -r win-x64 ${{ matrix.args }} -p:PublishSingleFile=true -o publish

      - name: 重命名
        run: Move-Item publish/GPGate.exe "publish/${{ matrix.file }}"

      - uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.artifact }}
          path: publish/${{ matrix.file }}
          if-no-files-found: error

  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    steps:
      # gh 需要仓库上下文
      - uses: actions/checkout@v7

      - uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true

      - name: 创建或更新 Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" dist/*.exe --clobber
          else
            gh release create "$GITHUB_REF_NAME" dist/*.exe --title "$GITHUB_REF_NAME" --generate-notes
          fi
